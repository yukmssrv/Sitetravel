{% extends 'country/base.html' %}
{% block sidebar %}{% endblock %}

{% block content %}
<h1>Удаление страны "{{ object.title }}"</h1>
<p>Вы уверены, что хотите удалить эту страну?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'home' %}">Отмена</a>
</form>
{% endblock %}
