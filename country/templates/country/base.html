<!DOCTYPE html>
{% load static %}
{% load mytags %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Сайт о путешествиях{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'country/css/styles.css' %}">
</head>
<body>
    <header>
        <img src="{% static 'country/images/travel.png' %}" alt="Логотип" height="50">
        {% include 'country/includes/menu.html' %}
    </header>

    {% block sidebar %}
    <div class="categories">
        {% show_categories %}
    </div>

    <div class="tags">
        {% show_all_tags %}
    </div>
    {% endblock %}

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p> 2026 Сайт о путешествиях</p>
    </footer>
</body>
</html>
